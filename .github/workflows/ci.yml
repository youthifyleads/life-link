name: Life Link CI / PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================================
  # 1. PR Sanity & Branch Convention Check
  # ============================================================================
  pr-validation:
    name: Validate PR & Conventions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Branch Naming Convention
        run: |
          HEAD_REF="${{ github.head_ref }}"

          echo "Checking branch: $HEAD_REF"

          if [[ "$HEAD_REF" =~ ^(feature|bugfix|release)/ ]] || [[ "$HEAD_REF" == "develop" ]]; then
            echo "Branch name conforms to conventions: $HEAD_REF"
          else
            echo "::warning::Branch '$HEAD_REF' does not match naming convention."
            echo "Expected: feature/*, bugfix/*, release/*"
          fi

      - name: Check for Disallowed Files & Secrets
        run: |
          echo "Scanning for accidental secret or environment files..."

          DISALLOWED=$(find . -maxdepth 3 \
            \( -name ".env" -o -name "*.key" -o -name "*.pem" -o -name "*.pfx" \) \
            ! -name ".env.example" 2>/dev/null || true)

          if [ -n "$DISALLOWED" ]; then
            echo "::error::Sensitive files detected:"
            echo "$DISALLOWED"
            exit 1
          fi

          echo "No sensitive files detected."

  # ============================================================================
  # 2. Backend CI - FastAPI / Python
  # ============================================================================
  backend-ci:
    name: Backend CI (FastAPI / Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt

          elif [ -f pyproject.toml ]; then
            pip install .

          else
            echo "No requirements.txt or pyproject.toml found."
            echo "Skipping dependency installation."
          fi

      - name: Validate Python Syntax & Lint
        run: |
          echo "Checking Python syntax..."

          python -m compileall .

          if command -v flake8 >/dev/null 2>&1; then
            echo "Running flake8..."

            flake8 . \
              --count \
              --select=E9,F63,F7,F82 \
              --show-source \
              --statistics
          else
            echo "flake8 not installed. Skipping lint."
          fi

      - name: Run Backend Tests
        run: |
          if [ -d "tests" ] || [ -f "pytest.ini" ] || [ -f "pyproject.toml" ]; then

            if command -v pytest >/dev/null 2>&1; then
              echo "Running pytest..."

              pytest \
                --maxfail=5 \
                --disable-warnings \
                -v

            else
              echo "pytest is not installed."
              echo "Trying unittest..."

              python -m unittest discover \
                -s tests \
                -p "*test*.py"
            fi

          else
            echo "No backend tests found."
            echo "Skipping backend tests."
          fi

  # ============================================================================
  # 3. Web CI - React / TypeScript
  # ============================================================================
  web-ci:
    name: Web CI (React / TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Node.js Setup
      # ------------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ------------------------------------------------------------------------
      # Check Web Project
      # ------------------------------------------------------------------------
      - name: Check Web Project
        run: |
          echo "Checking web project..."

          if [ ! -f package.json ]; then
            echo "::warning::web/package.json not found."
            echo "Web project is not initialized yet."
            exit 0
          fi

          echo "package.json found."
          echo "Web project is ready."

      # ------------------------------------------------------------------------
      # Install Dependencies
      # ------------------------------------------------------------------------
      - name: Install Web Dependencies
        run: |
          if [ -f package-lock.json ]; then

            echo "package-lock.json found."
            echo "Installing dependencies using npm ci..."

            npm ci

          else

            echo "::warning::package-lock.json not found."
            echo "Installing dependencies using npm install..."

            npm install

          fi

      # ------------------------------------------------------------------------
      # ESLint
      # ------------------------------------------------------------------------
      - name: Run Web Lint
        run: |
          echo "Checking for lint script..."

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then

            echo "Lint script found."
            echo "Running ESLint..."

            npm run lint

          else

            echo "No lint script found."
            echo "Skipping lint."

          fi

      # ------------------------------------------------------------------------
      # TypeScript Typecheck
      # ------------------------------------------------------------------------
      - name: Run TypeScript Typecheck
        run: |
          echo "Checking TypeScript configuration..."

          if [ -f tsconfig.json ]; then

            echo "tsconfig.json found."

            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.typecheck ? 0 : 1)"; then

              echo "Typecheck script found."
              echo "Running npm run typecheck..."

              npm run typecheck

            else

              echo "No typecheck script found."
              echo "Running TypeScript compiler directly..."

              npx tsc --noEmit

            fi

          else

            echo "No tsconfig.json found."
            echo "Skipping TypeScript typecheck."

          fi

      # ------------------------------------------------------------------------
      # Web Tests
      # ------------------------------------------------------------------------
      - name: Run Web Tests
        env:
          CI: true
        run: |
          echo "Checking for test script..."

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then

            echo "Test script found."
            echo "Running web tests..."

            npm test

          else

            echo "No test script found."
            echo "Skipping web tests."

          fi

      # ------------------------------------------------------------------------
      # Production Build
      # ------------------------------------------------------------------------
      - name: Build Web Application
        run: |
          echo "Checking for build script..."

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then

            echo "Build script found."
            echo "Building web application..."

            npm run build

          else

            echo "No build script found."
            echo "Skipping web build."

          fi

  # ============================================================================
  # 4. Mobile CI - Flutter / Dart
  # ============================================================================
  mobile-ci:
    name: Mobile CI (Flutter / Dart)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install Mobile Dependencies
        run: |
          if [ -f pubspec.yaml ]; then

            echo "Installing Flutter dependencies..."

            flutter pub get

          else

            echo "No pubspec.yaml found."
            echo "Skipping Flutter dependencies."

          fi

      - name: Run Flutter Analyze
        run: |
          if [ -f pubspec.yaml ]; then

            echo "Running Flutter analyze..."

            flutter analyze

          else

            echo "No Flutter project found."
            echo "Skipping analyze."

          fi

      - name: Run Flutter Tests
        run: |
          if [ -f pubspec.yaml ] && [ -d "test" ]; then

            echo "Running Flutter tests..."

            flutter test

          else

            echo "No Flutter tests found."
            echo "Skipping Flutter tests."

          fi

  # ============================================================================
  # 5. Database Migration Validation - MSSQL
  # ============================================================================
  database-validation:
    name: Database Migration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Migration Scripts
        run: |
          echo "Validating database migration scripts..."

          if [ ! -d "database/migrations" ]; then

            echo "database/migrations directory not found."
            echo "Skipping migration validation."

            exit 0

          fi

          SQL_FILES=$(find database/migrations \
            -maxdepth 1 \
            -type f \
            -name "*.sql" \
            2>/dev/null || true)

          if [ -n "$SQL_FILES" ]; then

            for f in $SQL_FILES; do

              echo "Checking migration script: $f"

              if [ ! -s "$f" ]; then

                echo "::error::Migration file $f is empty!"
                exit 1

              fi

            done

            echo "All migration scripts are valid."

          else

            echo "No SQL migration files found."
            echo "Skipping migration validation."

          fi

  # ============================================================================
  # 6. Overall Status Check Aggregator
  # ============================================================================
  ci-success:
    name: CI Status Check

    needs:
      - pr-validation
      - backend-ci
      - web-ci
      - mobile-ci
      - database-validation

    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Evaluate Job Results
        run: |
          echo "========================================="
          echo "Life Link CI Results"
          echo "========================================="

          echo "PR Validation:      ${{ needs.pr-validation.result }}"
          echo "Backend CI:         ${{ needs.backend-ci.result }}"
          echo "Web CI:             ${{ needs.web-ci.result }}"
          echo "Mobile CI:          ${{ needs.mobile-ci.result }}"
          echo "Database:           ${{ needs.database-validation.result }}"

          echo "========================================="

          if [[ "${{ needs.pr-validation.result }}" != "success" ]]; then
            echo "::error::PR Validation failed."
            exit 1
          fi

          if [[ "${{ needs.backend-ci.result }}" != "success" ]]; then
            echo "::error::Backend CI failed."
            exit 1
          fi

          if [[ "${{ needs.web-ci.result }}" != "success" ]]; then
            echo "::error::Web CI failed."
            exit 1
          fi

          if [[ "${{ needs.mobile-ci.result }}" != "success" ]]; then
            echo "::error::Mobile CI failed."
            exit 1
          fi

          if [[ "${{ needs.database-validation.result }}" != "success" ]]; then
            echo "::error::Database validation failed."
            exit 1
          fi

          echo "========================================="
          echo "All Life Link CI checks passed!"
          echo "========================================="
